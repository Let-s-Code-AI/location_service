# .github/workflows/mutation.yml
# Mutation testing: mutmut for the backend, StrykerJS for the frontend. It is
# not part of the pull-request gate (quality.yml): it takes longer and it
# measures the tests, not the change. Runs on demand (workflow_dispatch) and
# once a week. Thresholds: MUTATION_SCORE_MIN in services/backend/scripts/
# mutation.sh and thresholds.break in services/frontend/stryker.config.js.
# Stats and the HTML report are kept as workflow artifacts. `uses` steps
# ignore defaults.run.working-directory, hence the full paths.
name: Mutation testing


jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ./scripts/mutation.sh               # mutmut run + score >= MUTATION_SCORE_MIN
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-mutation-stats
          path: services/backend/mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:mutation               # stryker run; fails below thresholds.break
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-mutation-report
          path: services/frontend/reports/mutation/
          if-no-files-found: ignore
