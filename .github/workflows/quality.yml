name: Quality gate

on: pull_request

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/**'
              - '.github/workflows/quality.yml'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/quality.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/quality.yml'

  backend:
    if: needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # diff-cover potrzebuje historii main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ./scripts/quality.sh                 # ruff check + ruff format --check + pytest --cov (fail_under)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/backend/coverage.xml
          flags: backend
      - run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

  frontend:
    if: needs.changes.outputs.frontend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage               # vitest --coverage (progi w vite.config.js)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/frontend/coverage/lcov.info
          flags: frontend
      - run: npm run build

  scripts:
    if: needs.changes.outputs.scripts == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest scripts/tests -q               # scripts/changelog.py (stdlib only)

  # Every commit in the PR must be a Conventional Commit; scripts/changelog.py
  # relies on it to build the PR changelog. Merge commits are ignored.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # needs the base..head history
      - run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
      - run: >
          npx commitlint
          --extends @commitlint/config-conventional
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Single required status check for the main ruleset: passes when every
  # service job either succeeded or was skipped by the paths filter.
  ci-ok:
    if: always()
    needs: [changes, backend, frontend, scripts, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "At least one quality job failed or was cancelled"
            exit 1
          fi
