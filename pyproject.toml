[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "programming-tools-ai"
version = "0.1.0"
description = "FastAPI + SQLite (SQLAlchemy async) application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "aiosqlite==0.19.0",
    "greenlet==3.0.1",
    "pydantic-settings==2.5.2",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["sql_app*"]
