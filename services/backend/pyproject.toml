[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "programming-tools-ai"
version = "0.1.0"
description = "FastAPI + SQLite (SQLAlchemy async) application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.9.2",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "aiosqlite==0.19.0",
    "greenlet==3.0.1",
    "pydantic-settings==2.5.2",
    "PyJWT==2.9.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.1.0",
    "httpx==0.27.2",
    "ruff==0.17.4",
    "diff-cover==11.0.1",
    "mutmut==3.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage is collected by `pytest --cov` (scripts/quality.sh). The measured
# surface is the application code: tests, migrations, one-off scripts, the
# `alembic upgrade` entry point and mutmut's working copy are left out.
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "scripts/*",
    "venv/*",
    "mutants/*",
    "sql_app/init_db.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

# Mutation testing: `mutmut run` (see README, "Mutation testing"). mutmut copies
# `source_paths` and `also_copy` into mutants/, mutates the sources and runs
# pytest from that directory. The surface mirrors [tool.coverage.run].
[tool.mutmut]
source_paths = ["main.py", "sql_app"]
# Imported by sql_app.database; settings only, nothing worth mutating.
also_copy = ["config.py"]
# Thin `alembic upgrade head` wrapper, also left out of coverage.
do_not_mutate = ["sql_app/init_db.py"]
# The Alembic check runs the CLI from the backend root, which mutants/ is not.
pytest_add_cli_args = ["--ignore=tests/test_migrations.py"]

[tool.ruff]
target-version = "py311"
# Migrations are generated by Alembic and are never reformatted or linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes + a subset of pycodestyle, isort, bugbear and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts these calls in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["sql_app*"]
