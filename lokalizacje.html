<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokalizacje</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e4e8f0;
    --text: #1a1f2e;
    --muted: #6b7489;
    --primary: #2457c5;
    --primary-600: #1c47a6;
    --primary-50: #eef3fd;
    --danger: #d23b3b;
    --danger-50: #fdeeee;
    --success: #1f9d61;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px 64px; }

  /* Header */
  .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -.02em; }
  .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
  .stat-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-50); color: var(--primary); flex-shrink: 0; }
  .stat-icon.warn { background: #fff5e6; color: #c27a0a; }
  .stat-icon.ok { background: #e9f8f0; color: var(--success); }
  .stat-value { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 13px; color: var(--muted); }

  /* Card */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-title { font-size: 16px; font-weight: 650; margin: 0; }
  .card-body { padding: 20px 24px 24px; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 14px; align-items: end; }
  .field label { display: block; font-size: 13px; font-weight: 550; margin-bottom: 6px; color: #3a4256; }
  .field label .req { color: var(--danger); }
  .input-wrap { position: relative; }
  .input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9aa3b5; pointer-events: none; }
  input[type="text"], input[type="search"] {
    width: 100%; height: 42px; padding: 0 12px 0 38px;
    border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 14px; color: var(--text); background: #fbfcfe;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(36,87,197,.12); }
  input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(210,59,59,.1); }
  .hint { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .05s, box-shadow .15s, color .15s;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(36,87,197,.3); }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); height: 34px; padding: 0 12px; font-size: 13px; }
  .btn-ghost:hover { color: var(--text); background: #f5f7fb; }
  .btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 8px; background: transparent; color: #8a93a6; border: 1px solid transparent; }
  .btn-icon:hover { background: var(--danger-50); color: var(--danger); border-color: #f6d4d4; }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; align-items: center; }
  .toolbar .input-wrap { width: 260px; }
  .toolbar input { height: 36px; font-size: 13px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  thead th {
    text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); background: #f8f9fc; padding: 12px 16px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    user-select: none; cursor: pointer; white-space: nowrap;
  }
  thead th.no-sort { cursor: default; }
  thead th .arrow { opacity: .35; margin-left: 4px; font-size: 10px; }
  thead th.sorted .arrow { opacity: 1; color: var(--primary); }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #fafbff; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.enter { animation: enter .35s ease; }
  tbody tr.leave { animation: leave .25s ease forwards; }
  @keyframes enter { from { background: #e8f0ff; } to { background: transparent; } }
  @keyframes leave { to { opacity: 0; transform: translateX(12px); } }

  .id-badge { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted); background: #f1f3f8; padding: 3px 8px; border-radius: 6px; }
  .city { display: flex; align-items: center; gap: 12px; font-weight: 550; }
  .avatar { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .empty { color: #b3bacb; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .tag.ok { color: var(--success); background: #e9f8f0; }
  .tag.warn { color: #c27a0a; background: #fff5e6; }
  .actions { text-align: right; }

  .empty-state { text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty-state svg { color: #c4cad8; margin-bottom: 10px; }
  .empty-state strong { display: block; color: var(--text); margin-bottom: 4px; }

  .table-foot { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }

  /* Toast */
  .toast {
    position: fixed; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px;
    background: #1a1f2e; color: #fff; padding: 12px 14px 12px 16px; border-radius: 12px;
    font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
    transform: translateY(20px); opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .toast button { background: transparent; border: none; color: #8fb2ff; font: inherit; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .toast button:hover { background: rgba(255,255,255,.08); }

  @media (max-width: 880px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .btn { grid-column: 1 / -1; }
    .stats { grid-template-columns: 1fr; }
    .toolbar .input-wrap { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="page-header">
    <div>
      <div class="eyebrow">Słowniki</div>
      <h1>Lokalizacje</h1>
      <p class="subtitle">Zarządzaj adresami: miastami, miejscowościami, dzielnicami i ulicami.</p>
    </div>
  </header>

  <section class="stats">
    <div class="stat">
      <div class="stat-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
      <div><div class="stat-value" id="statTotal">0</div><div class="stat-label">Wszystkie lokalizacje</div></div>
    </div>
    <div class="stat">
      <div class="stat-icon ok"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div><div class="stat-value" id="statComplete">0</div><div class="stat-label">Kompletne dane</div></div>
    </div>
    <div class="stat">
      <div class="stat-icon warn"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <div><div class="stat-value" id="statCities">0</div><div class="stat-label">Unikalne miasta</div></div>
    </div>
  </section>

  <!-- Formularz -->
  <section class="card" style="margin-bottom:24px">
    <div class="card-head"><h2 class="card-title">Dodaj lokalizację</h2></div>
    <div class="card-body">
      <form id="form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="miasto">Miasto <span class="req">*</span></label>
            <div class="input-wrap">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1"/></svg>
              <input type="text" id="miasto" placeholder="np. Warszawa" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="miejscowosc">Miejscowość</label>
            <div class="input-wrap">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
              <input type="text" id="miejscowosc" placeholder="np. Wesoła" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="dzielnica">Dzielnica</label>
            <div class="input-wrap">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
              <input type="text" id="dzielnica" placeholder="np. Mokotów" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="ulica">Ulica</label>
            <div class="input-wrap">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19 8 5M20 19 16 5M12 6v2M12 11v2M12 16v2"/></svg>
              <input type="text" id="ulica" placeholder="np. Puławska" autocomplete="off">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Dodaj
          </button>
        </div>
        <div class="hint" id="hint"></div>
      </form>
    </div>
  </section>

  <!-- Tabela -->
  <section class="card">
    <div class="card-head" style="padding-bottom:16px">
      <h2 class="card-title">Lista lokalizacji</h2>
      <div class="toolbar">
        <div class="input-wrap">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Szukaj…">
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="id">ID <span class="arrow">▲</span></th>
            <th data-key="miasto">Miasto <span class="arrow">▲</span></th>
            <th data-key="dzielnica">Dzielnica <span class="arrow">▲</span></th>
            <th data-key="ulica">Ulica <span class="arrow">▲</span></th>
            <th class="no-sort">Status</th>
            <th class="no-sort"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="table-foot">
      <span id="countInfo"></span>
      <button class="btn btn-ghost" id="cleanBtn" type="button">Usuń puste wpisy</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" type="button">Cofnij</button></div>

<script>
  // --- Dane (podmień na fetch do swojego API) ---
  let items = [
    { id: 2, miasto: "Warszawa", miejscowosc: "", dzielnica: "test", ulica: "test" },
    { id: 3, miasto: "test", miejscowosc: "", dzielnica: "test", ulica: "test" },
    { id: 4, miasto: "", miejscowosc: "", dzielnica: "", ulica: "" },
    { id: 5, miasto: "", miejscowosc: "", dzielnica: "", ulica: "" },
  ];
  let nextId = 8;
  let sort = { key: "id", dir: 1 };
  let query = "";
  let lastDeleted = null, toastTimer = null, newId = null;

  const $ = (id) => document.getElementById(id);
  const fields = ["miasto", "miejscowosc", "dzielnica", "ulica"];
  const palette = ["#2457c5", "#7b3fd1", "#0f8a7a", "#c2410c", "#be185d", "#0369a1"];

  const esc = (s) => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const cell = (v) => v ? esc(v) : '<span class="empty">—</span>';
  const isComplete = (it) => it.miasto && it.dzielnica && it.ulica;
  const isEmpty = (it) => fields.every(f => !it[f]);
  const colorFor = (s) => palette[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % palette.length];

  function render() {
    const q = query.toLowerCase();
    const rows = items
      .filter(it => !q || fields.some(f => it[f].toLowerCase().includes(q)) || String(it.id) === q)
      .sort((a, b) => {
        const x = a[sort.key], y = b[sort.key];
        return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "pl")) * sort.dir;
      });

    $("tbody").innerHTML = rows.length ? rows.map(it => {
      const name = it.miasto || "Bez nazwy";
      const initials = it.miasto ? it.miasto.slice(0, 2).toUpperCase() : "?";
      const bg = it.miasto ? colorFor(it.miasto) : "#c4cad8";
      return `
      <tr data-id="${it.id}" class="${it.id === newId ? "enter" : ""}">
        <td><span class="id-badge">#${it.id}</span></td>
        <td>
          <div class="city">
            <div class="avatar" style="background:${bg}">${esc(initials)}</div>
            <div>${it.miasto ? esc(name) : '<span class="empty">Bez nazwy</span>'}
              ${it.miejscowosc ? `<span class="sub">${esc(it.miejscowosc)}</span>` : ""}
            </div>
          </div>
        </td>
        <td>${cell(it.dzielnica)}</td>
        <td>${cell(it.ulica)}</td>
        <td>${isComplete(it) ? '<span class="tag ok">Kompletna</span>' : '<span class="tag warn">Niepełna</span>'}</td>
        <td class="actions">
          <button class="btn btn-icon" title="Usuń" data-del="${it.id}">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
          </button>
        </td>
      </tr>`;
    }).join("") : `
      <tr><td colspan="6"><div class="empty-state">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <strong>${query ? "Brak wyników" : "Brak lokalizacji"}</strong>
        ${query ? "Spróbuj innej frazy." : "Dodaj pierwszą lokalizację formularzem powyżej."}
      </div></td></tr>`;

    newId = null;
    document.querySelectorAll("thead th[data-key]").forEach(th => {
      const on = th.dataset.key === sort.key;
      th.classList.toggle("sorted", on);
      th.querySelector(".arrow").textContent = on && sort.dir === -1 ? "▼" : "▲";
    });

    $("statTotal").textContent = items.length;
    $("statComplete").textContent = items.filter(isComplete).length;
    $("statCities").textContent = new Set(items.map(i => i.miasto.toLowerCase()).filter(Boolean)).size;
    $("countInfo").textContent = `Wyświetlono ${rows.length} z ${items.length}`;
    $("cleanBtn").style.visibility = items.some(isEmpty) ? "visible" : "hidden";
  }

  // Dodawanie z walidacją (blokuje puste wpisy)
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = Object.fromEntries(fields.map(f => [f, $(f).value.trim()]));
    $("miasto").classList.remove("invalid");
    if (!data.miasto) {
      $("miasto").classList.add("invalid");
      $("hint").textContent = "Pole „Miasto” jest wymagane.";
      $("miasto").focus();
      return;
    }
    $("hint").textContent = "";
    const item = { id: nextId++, ...data };
    items.push(item);
    newId = item.id;
    fields.forEach(f => $(f).value = "");
    $("miasto").focus();
    render();
    toast(`Dodano lokalizację #${item.id}`, false);
  });
  $("miasto").addEventListener("input", () => { $("miasto").classList.remove("invalid"); $("hint").textContent = ""; });

  // Usuwanie z animacją i „Cofnij”
  $("tbody").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-del]");
    if (!btn) return;
    const id = Number(btn.dataset.del);
    const tr = btn.closest("tr");
    tr.classList.add("leave");
    setTimeout(() => {
      const idx = items.findIndex(i => i.id === id);
      lastDeleted = [{ item: items[idx], idx }];
      items.splice(idx, 1);
      render();
      toast(`Usunięto lokalizację #${id}`, true);
    }, 220);
  });

  $("cleanBtn").addEventListener("click", () => {
    lastDeleted = items.map((item, idx) => ({ item, idx })).filter(x => isEmpty(x.item));
    items = items.filter(i => !isEmpty(i));
    render();
    toast(`Usunięto ${lastDeleted.length} pustych wpisów`, true);
  });

  $("toastUndo").addEventListener("click", () => {
    if (!lastDeleted) return;
    lastDeleted.forEach(({ item, idx }) => items.splice(idx, 0, item));
    lastDeleted = null;
    render();
    $("toast").classList.remove("show");
  });

  function toast(msg, undo) {
    $("toastMsg").textContent = msg;
    $("toastUndo").style.display = undo ? "" : "none";
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
  }

  // Sortowanie i wyszukiwanie
  document.querySelectorAll("thead th[data-key]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key;
    sort = { key: k, dir: sort.key === k ? -sort.dir : 1 };
    render();
  }));
  $("search").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });

  render();
</script>
</body>
</html>
